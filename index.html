<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino 5 km</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#14181c;--mute:#5a6570;--line:#d9dfe5;--run:#15803d;--walk:#1d4ed8;--warm:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111519;--card:#1b2127;--ink:#eef1f4;--mute:#9aa6b1;--line:#2b343c}}
:root[data-theme="dark"]{--bg:#111519;--card:#1b2127;--ink:#eef1f4;--mute:#9aa6b1;--line:#2b343c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 34px/1 "Barlow Condensed",Impact,sans-serif;margin:6px 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.weeks{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:6px}
.wk{flex:0 0 auto;min-width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 20px "Barlow Condensed",sans-serif;position:relative}
.wk.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk.ok::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--run)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;color:var(--ink);font:inherit}
.card b{font:700 22px "Barlow Condensed",sans-serif}
.card .g{color:var(--mute)}
.card .tt{float:right;font:600 15px "Barlow Condensed",sans-serif;color:var(--mute)}
.strip{display:flex;gap:2px;height:14px;margin:10px 0 8px;border-radius:4px;overflow:hidden}
.strip i{display:block;min-width:2px}
.i-warm{background:var(--warm)}.i-run{background:var(--run)}.i-walk{background:var(--walk)}
.done{color:var(--run);font-weight:600}
.back{background:none;border:0;color:var(--mute);font:600 16px Barlow,sans-serif;padding:8px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row span:first-child{color:var(--mute)}.row b{text-align:right}
.adj{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.adj div{display:flex;align-items:center;gap:14px}
.adj button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 26px sans-serif}
.adj output{font:700 30px "Barlow Condensed",sans-serif;min-width:40px;text-align:center}
label.chk{display:flex;gap:10px;align-items:center;padding:8px 0}
label.chk input{width:22px;height:22px}
.go{width:100%;height:64px;border:0;border-radius:14px;background:var(--run);color:#fff;font:700 28px "Barlow Condensed",sans-serif;margin:14px 0 8px}
.ghost{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 16px Barlow,sans-serif}
.note{color:var(--mute);font-size:14px;margin-top:18px}
#run{position:fixed;inset:0;z-index:20;color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);transition:background .25s}
.p-warm{background:#b45309}.p-run{background:#15803d}.p-walk{background:#1d4ed8}.p-end{background:#374151}
.rtop{display:flex;justify-content:space-between;font:600 18px Barlow,sans-serif;opacity:.9}
#rl{font:700 52px/1 "Barlow Condensed",sans-serif;display:block;margin-top:10px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#rt{font:700 clamp(110px,34vw,210px)/0.95 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.spd{margin-top:14px;font:600 20px Barlow,sans-serif;opacity:.95}
.spd b{display:block;font:700 44px/1.1 "Barlow Condensed",sans-serif}
.nx{margin-top:18px;font-size:18px;opacity:.9}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:#fff}
.tot{text-align:center;opacity:.9;margin-bottom:14px}
.btns{display:flex;gap:10px}
.btns button{flex:1;height:56px;border-radius:12px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;font:600 18px Barlow,sans-serif}
.btns button.main{background:#fff;color:#14181c;border-color:#fff}
</style>
</head>
<body>
<main id="app"></main>
<div id="run" hidden></div>
<script>
const WS="5,0–5,5";
const I=(t,goal,run,walk,reps,rs,o={})=>({t,goal,kind:"int",run,walk,reps,lo:o.lo||reps,hi:o.hi||reps,fin:o.fin||0,rs,ws:WS,warm:5,note:o.note||""});
const C=(t,goal,min,lo,hi,rs,o={})=>({t,goal,kind:"cont",min,lo,hi,rs,ws:o.ws||WS,warm:5,note:o.note||""});
const PLAN={};
const add=(ws,list)=>ws.forEach(w=>PLAN[w]=list.map(x=>({...x,w})));
add([1,2],[I("T1","Corrida fácil",2,2,5,"5,5–6,0"),I("T2","Intervalado leve",3,2,4,"5,8–6,4"),I("T3","Aumentar tempo correndo",4,2,4,"5,5–6,2")]);
add([3,4],[I("T1","Blocos de corrida",5,2,3,"5,5–6,2"),I("T2","Corrida progressiva",8,2,2,"5,5–6,3",{fin:5}),I("T3","Treino longo",10,2,2,"5,4–6,2",{fin:9,note:"O bloco final pode ter de 8 a 10 min; o app usa 9."})]);
add([5,6],[C("T1","Corrida fácil",30,30,35,"5,2–6,0",{note:"Se precisar, faça pausas curtas de caminhada."}),I("T2","Intervalado",6,2,3,"5,8–6,5"),C("T3","Contínuo",22,20,25,"5,2–5,9",{note:"Caminhada opcional."})]);
add([7],[C("T1","Fácil",27,25,30,"5,2–5,9"),I("T2","Intervalado controlado",8,2,2,"5,8–6,4",{lo:2,hi:3}),C("T3","Longo",32,30,35,"5,2–5,9",{note:"Caminhada opcional."})]);
add([8],[C("T1","Fácil",25,20,30,"5,2–5,9"),C("T2","Soltar as pernas",17,15,20,"5,0–5,7",{ws:"4,8–5,3"}),{w:8,t:"T3",goal:"Teste de 5 km",kind:"test",rs:"5,2–5,9 no início",ws:"4,8–5,5",warm:5,note:"Comece controlado e ajuste pela sensação. Toque em Concluir ao completar os 5 km."}]);

const KEY="treino5k_v1";
let store={done:{},voice:true,sound:true};
try{Object.assign(store,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const id=x=>x.w+"-"+x.t;
let week=1,cur=null,val=0,R=null;
const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

function build(x,n){
  const s=[{p:"warm",d:x.warm*60,l:"Aquecimento",sp:x.ws}];
  if(x.kind==="int"){
    for(let i=0;i<n;i++){s.push({p:"run",d:x.run*60,l:"Corrida",sp:x.rs});s.push({p:"walk",d:x.walk*60,l:"Caminhada",sp:x.ws})}
    if(x.fin)s.push({p:"run",d:x.fin*60,l:"Corrida",sp:x.rs});
  }else if(x.kind==="cont")s.push({p:"run",d:n*60,l:"Corrida",sp:x.rs});
  else s.push({p:"run",d:0,l:"Corrida: 5 km",sp:x.rs});
  return s;
}
function sumText(x,n){
  if(x.kind==="int")return x.warm+" min de aquecimento, "+n+"× ("+x.run+" min correndo + "+x.walk+" min caminhando)"+(x.fin?" e "+x.fin+" min correndo no final":"");
  if(x.kind==="cont")return x.warm+" min de aquecimento e "+n+" min de corrida contínua";
  return x.warm+" min de aquecimento e 5 km contínuos";
}
function defVal(x){return x.kind==="int"?x.reps:x.kind==="cont"?x.min:0}
function strip(segs){return '<div class="strip">'+segs.map(s=>'<i class="i-'+s.p+'" style="flex:'+(s.d||1200)+'"></i>').join("")+"</div>"}
const total=segs=>segs.reduce((a,s)=>a+s.d,0);

function home(){
  cur=null;
  const wk=[1,2,3,4,5,6,7,8].map(w=>'<button class="wk'+(w===week?" on":"")+(PLAN[w].every(x=>store.done[id(x)])?" ok":"")+'" onclick="setWeek('+w+')">'+w+'</button>').join("");
  const cards=PLAN[week].map((x,i)=>{
    const segs=build(x,defVal(x)),m=Math.round(total(segs)/60);
    return '<button class="card" onclick="open_('+i+')"><span class="tt">'+(x.kind==="test"?"":"≈ "+m+" min")+'</span><b>'+x.t+" — "+x.goal+'</b>'+strip(segs)+'<div class="g">'+sumText(x,defVal(x))+'</div>'+(store.done[id(x)]?'<div class="done">Feito</div>':"")+"</button>";
  }).join("");
  $("#app").innerHTML='<h1>Primeiros 5 km</h1><p class="sub">Escolha a semana e o treino. O app avisa quando correr e quando caminhar.</p><div class="weeks">'+wk+"</div>"+cards+'<p class="note">As velocidades são pontos de partida. Se ficar ofegante demais, reduza. Se a semana parecer difícil, repita antes de avançar. Dor persistente ou sintomas incomuns: pare e procure avaliação profissional.</p>';
}
function setWeek(w){week=w;home()}
function open_(i){cur=PLAN[week][i];val=defVal(cur);setup()}
function setup(){
  const x=cur,segs=build(x,val),adj=x.kind!=="test"&&x.lo!==x.hi;
  const unit=x.kind==="int"?"Repetições":"Minutos de corrida";
  $("#app").innerHTML='<button class="back" onclick="home()">‹ Semana '+x.w+'</button><h1>'+x.t+" — "+x.goal+'</h1><p class="sub">'+sumText(x,val)+"</p>"+strip(segs)+
  '<div class="row"><span>Corrida</span><b>'+x.rs+' km/h</b></div><div class="row"><span>Caminhada e aquecimento</span><b>'+x.ws+' km/h</b></div>'+
  (adj?'<div class="adj"><span>'+unit+'<br><small style="color:var(--mute)">Faixa do plano: '+x.lo+" a "+x.hi+'</small></span><div><button onclick="bump(-1)" aria-label="Diminuir">−</button><output>'+val+'</output><button onclick="bump(1)" aria-label="Aumentar">+</button></div></div>':"")+
  (x.note?'<p class="note">'+x.note+"</p>":"")+
  '<label class="chk"><input type="checkbox" '+(store.voice?"checked":"")+' onchange="store.voice=this.checked;save()"> Avisos por voz</label><label class="chk"><input type="checkbox" '+(store.sound?"checked":"")+' onchange="store.sound=this.checked;save()"> Bipes e vibração</label>'+
  '<button class="go" onclick="startRun()">Iniciar treino</button><button class="ghost" onclick="toggleDone()">'+(store.done[id(x)]?"Desmarcar como feito":"Marcar como feito")+"</button>"+
  '<p class="note">Deixe a tela ligada e o volume alto. O app tenta impedir que a tela apague durante o treino.</p>';
}
function bump(d){val=Math.min(cur.hi,Math.max(cur.lo,val+d));setup()}
function toggleDone(){store.done[id(cur)]=!store.done[id(cur)];if(!store.done[id(cur)])delete store.done[id(cur)];save();setup()}

let AC=null,wl=null;
function beep(f,d){if(!store.sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.4,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function vib(p){if(store.sound&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function say(t){if(!store.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";speechSynthesis.speak(u)}catch(e){}}
async function wake(){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(R&&!document.hidden)wake()});

function startRun(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(AC&&AC.state==="suspended")AC.resume();
  wake();
  const segs=build(cur,val);
  R={x:cur,segs,i:0,paused:false,stopArm:0};
  $("#run").hidden=false;
  $("#run").innerHTML='<div class="rtop"><span id="rn"></span><span>'+cur.t+' • Semana '+cur.w+'</span></div><span id="rl"></span><div class="mid"><div id="rt">00:00</div><div class="spd">Esteira em<b id="rs"></b></div><div class="nx" id="rx"></div></div><div class="bar"><i id="rb"></i></div><div class="tot" id="rtot"></div><div class="btns"><button id="bp" class="main" onclick="pause()">Pausar</button><button onclick="skip()" id="bs">Pular</button><button onclick="stopArm()" id="bx">Encerrar</button></div>';
  enter(0);
  R.timer=setInterval(tick,250);
}
function enter(i){
  R.i=i;const s=R.segs[i];R.segStart=Date.now();R.end=s.d?R.segStart+s.d*1000:0;R.last=-1;
  document.getElementById("run").className="p-"+s.p;
  $("#rl").textContent=s.l;$("#rn").textContent="Etapa "+(i+1)+" de "+R.segs.length;
  $("#rs").textContent=s.sp+" km/h";
  const n=R.segs[i+1];
  $("#rx").textContent=n?"Depois: "+n.l.toLowerCase()+(n.d?", "+Math.round(n.d/60)+" min":""):(s.d?"Última etapa":"");
  $("#bs").textContent=s.d?"Pular":"Concluir";
  beep(1175,.5);vib([300]);
  const sp=s.sp.replace("–"," a ").replace(" no início","");
  say(s.p==="run"?(s.d?"Corra. "+Math.round(s.d/60)+" minutos. Esteira em "+sp:"Corra. Cinco quilômetros. Esteira em "+sp):s.p==="walk"?"Caminhe. Esteira em "+sp:"Aquecimento. Caminhe leve. Esteira em "+sp);
}
function tick(){
  if(!R||R.paused)return;
  const s=R.segs[R.i],now=Date.now();
  const rem=s.d?Math.ceil((R.end-now)/1000):Math.floor((now-R.segStart)/1000);
  if(s.d){
    if(rem<=0){next();return}
    if(rem<=3&&R.last!==rem){beep(880,.12);vib([60])}
    if(rem===30&&R.last!==30&&s.d>=90)say("Faltam 30 segundos");
  }
  R.last=rem;
  $("#rt").textContent=fmt(rem);
  const known=R.segs.every(z=>z.d);
  if(known){
    let rest=rem;for(let j=R.i+1;j<R.segs.length;j++)rest+=R.segs[j].d;
    const T=total(R.segs);$("#rb").style.width=Math.min(100,(1-rest/T)*100)+"%";$("#rtot").textContent="Restam "+fmt(rest)+" no treino";
  }else{
    $("#rtot").textContent=R.i?"Toque em Concluir ao completar os 5 km":"Aquecimento antes do teste";
    $("#rb").style.width=R.i?"100%":Math.min(100,(1-rem/R.segs[0].d)*100)+"%";
  }
}
function next(){if(R.i+1>=R.segs.length)finish(true);else enter(R.i+1)}
function skip(){if(R)next()}
function pause(){
  if(!R.paused){R.paused=true;const s=R.segs[R.i];R.rem=R.end-Date.now();R.el=Date.now()-R.segStart;$("#bp").textContent="Retomar";say("Pausado")}
  else{R.paused=false;const s=R.segs[R.i],n=Date.now();R.end=s.d?n+R.rem:0;R.segStart=n-R.el;$("#bp").textContent="Pausar"}
}
function stopArm(){
  if(!R.stopArm){R.stopArm=1;$("#bx").textContent="Toque de novo";setTimeout(()=>{if(R&&R.stopArm){R.stopArm=0;$("#bx").textContent="Encerrar"}},3000)}
  else finish(false);
}
function finish(ok){
  const s=R.segs[R.i],el=Math.floor((Date.now()-R.segStart)/1000);
  clearInterval(R.timer);try{wl&&wl.release()}catch(e){}
  try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  if(ok){store.done[id(R.x)]=true;save();beep(1175,.6);vib([300,100,300]);say("Treino concluído. Bom trabalho!")}
  const t=ok&&!s.d?'<div class="spd">Tempo dos 5 km<b>'+fmt(el)+"</b></div>":"";
  $("#run").className="p-end";
  $("#run").innerHTML='<div class="mid"><span id="rl" style="margin:0">'+(ok?"Treino concluído":"Treino encerrado")+"</span>"+t+'</div><div class="btns"><button class="main" onclick="closeRun()">Voltar</button></div>';
  if(ok&&s.d===0){/* teste: tempo mostrado acima */}
  R=null;
}
function closeRun(){$("#run").hidden=true;home()}

week=(()=>{for(let w=1;w<=8;w++)if(!PLAN[w].every(x=>store.done[id(x)]))return w;return 8})();
home();
</script>
</body>
</html>
